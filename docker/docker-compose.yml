services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  timescaledb:
    image: timescale/timescaledb:latest-pg12
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iot_db
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - timescaledb
    environment:
      - PYTHONUNBUFFERED=1
      - ON_PREM_SERVER_IP=${ON_PREM_SERVER_IP:-192.168.1.25}
      - ON_PREM_SERVER_PORT=${ON_PREM_SERVER_PORT:-8000}
      - ON_PREM_DATA_ENDPOINT=${ON_PREM_DATA_ENDPOINT:-/api/data}
      - ON_PREM_PROTOCOL=${ON_PREM_PROTOCOL:-http}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
      - timescaledb
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - ON_PREM_SERVER_IP=${ON_PREM_SERVER_IP:-192.168.1.25}
      - ON_PREM_SERVER_PORT=${ON_PREM_SERVER_PORT:-8000}
      - ON_PREM_DATA_ENDPOINT=${ON_PREM_DATA_ENDPOINT:-/api/data}
      - ON_PREM_PROTOCOL=${ON_PREM_PROTOCOL:-http}

volumes:
  timescale-data: